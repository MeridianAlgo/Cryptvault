name: Lint and Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort flake8 pylint mypy bandit safety
        pip install -r requirements.txt

    - name: Run Ruff (Fast Linter)
      id: ruff
      continue-on-error: true
      run: |
        ruff check cryptvault/ cryptvault_cli.py --output-format=github || echo "RUFF_FAILED=true" >> $GITHUB_ENV

    - name: Run Black (Code Formatting)
      id: black
      continue-on-error: true
      run: |
        black --check --diff cryptvault/ cryptvault_cli.py || echo "BLACK_FAILED=true" >> $GITHUB_ENV

    - name: Run isort (Import Sorting)
      id: isort
      continue-on-error: true
      run: |
        isort --check-only --diff cryptvault/ cryptvault_cli.py || echo "ISORT_FAILED=true" >> $GITHUB_ENV

    - name: Run Flake8 (Style Guide)
      id: flake8
      continue-on-error: true
      run: |
        flake8 cryptvault/ cryptvault_cli.py --count --select=E9,F63,F7,F82 --show-source --statistics || echo "FLAKE8_FAILED=true" >> $GITHUB_ENV
        flake8 cryptvault/ cryptvault_cli.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Run Pylint (Code Analysis)
      id: pylint
      continue-on-error: true
      run: |
        pylint cryptvault/ cryptvault_cli.py --exit-zero --output-format=text || echo "PYLINT_FAILED=true" >> $GITHUB_ENV

    - name: Run MyPy (Type Checking)
      id: mypy
      continue-on-error: true
      run: |
        mypy cryptvault/ cryptvault_cli.py --ignore-missing-imports || echo "MYPY_FAILED=true" >> $GITHUB_ENV

    - name: Run Bandit (Security Linting)
      id: bandit
      continue-on-error: true
      run: |
        bandit -r cryptvault/ -f json -o bandit-report.json || echo "BANDIT_FAILED=true" >> $GITHUB_ENV
        bandit -r cryptvault/ -f screen

    - name: Run Safety (Dependency Security)
      id: safety
      continue-on-error: true
      run: |
        safety check --json || echo "SAFETY_FAILED=true" >> $GITHUB_ENV

    - name: Summary
      if: always()
      run: |
        echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
        echo "- Ruff: ${{ env.RUFF_FAILED != 'true' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Black: ${{ env.BLACK_FAILED != 'true' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- isort: ${{ env.ISORT_FAILED != 'true' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Flake8: ${{ env.FLAKE8_FAILED != 'true' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- MyPy: ${{ env.MYPY_FAILED != 'true' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Bandit: ${{ env.BANDIT_FAILED != 'true' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY

    - name: Fail workflow if critical issues found
      if: env.RUFF_FAILED == 'true' || env.FLAKE8_FAILED == 'true' || env.BANDIT_FAILED == 'true'
      run: exit 1
