name: Lint and Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff + Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff (source of truth)
        run: ruff check cryptvault/ cryptvault_cli.py --output-format=github

      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check cryptvault/ cryptvault_cli.py

      - name: Bandit (security, medium+ only)
        continue-on-error: true
        run: bandit -c pyproject.toml -r cryptvault/ -ll

      - name: Summary
        if: always()
        run: echo "Lint pipeline finished." >> "$GITHUB_STEP_SUMMARY"
